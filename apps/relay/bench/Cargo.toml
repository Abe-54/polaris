[package]
name = "relay-bench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hdrhistogram = "7.6.0"
libc = "0.2.191"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "net",
  "time",
  "macros",
  "sync",
  "process",
  "io-util",
  "signal",
] }
tokio-tungstenite = "0.30.0"
