[package]
name = "polaris-relay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
hmac = "0.13.0"
httparse = "1.10.1"
indexmap = "2.14.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = [
  "rt",
  "net",
  "time",
  "macros",
  "sync",
  "signal",
  "io-util",
] }
